<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran KKG Raden Keling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Garis Khas KOP Surat */
        .kop-line { border-bottom: 3px solid black; border-top: 1px solid black; height: 4px; margin-top: 2px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-6 md:py-10 px-4">

    <div class="max-w-2xl mx-auto bg-white p-6 md:p-8 shadow-md rounded-lg">
        
        <div class="flex items-center justify-between mb-4 gap-2">
            <img src="https://bronze-above-bobcat-500.mypinata.cloud/ipfs/bafkreigtkz4jplo7lclbazgfj2ym5ovi67qfliwzpiyo46weklzutqb6ve" 
                 alt="Logo KKG" class="w-12 h-12 md:w-16 md:h-16 object-contain flex-shrink-0">
            
            <div class="text-center flex-1">
                <h2 class="text-[10px] md:text-sm font-bold uppercase leading-tight">Pemerintah Kabupaten Bangka Selatan</h2>
                <h2 class="text-[10px] md:text-sm font-bold uppercase leading-tight">Dinas Pendidikan dan Kebudayaan</h2>
                <h2 class="text-sm md:text-lg font-bold uppercase tracking-tighter md:tracking-normal">KKG Gugus Raden Keling</h2>
                <p class="text-[9px] md:text-xs uppercase tracking-widest">Kecamatan Toboali</p>
            </div>

            <img src="https://bronze-above-bobcat-500.mypinata.cloud/ipfs/bafkreihhlm7tpcna22ccrt5qcudx3kmglbeiuh46cnhiwklbponwyrwtna" 
                 alt="Logo Kabupaten" class="w-12 h-12 md:w-16 md:h-16 object-contain flex-shrink-0">
        </div>
        <div class="kop-line mb-6"></div>

        <div class="text-center mb-8">
            <h3 class="font-bold text-lg underline uppercase">Form Pendaftaran Pertemuan KKG</h3>
            <p class="text-sm text-gray-600 italic">Minggu, 10 Mei 2026</p>
        </div>

        <script type="text/javascript">var submitted=false;</script>
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { alert('Pendaftaran Berhasil Terkirim!'); window.location.reload(); }"></iframe>

        <form action="https://docs.google.com/forms/d/e/1FAIpQLSdibpJl0tcqBLLopbWixqCjNB5prD99Mn72RyUAiZX34SAmMw/formResponse" 
              method="POST" 
              target="hidden_iframe" 
              onsubmit="submitted=true;">

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" name="entry.1996415377" placeholder="Nama Lengkap sesuai Gelar" 
                        class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none border-gray-300 transition-all" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">NIP</label>
                    <input type="text" name="entry.217250218" placeholder="Masukkan NIP" 
                        class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none border-gray-300 transition-all" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Jabatan</label>
                    <input type="text" name="entry.1195587778" placeholder="Contoh: Guru Kelas / Guru Mapel" 
                        class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none border-gray-300 transition-all" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Instansi</label>
                    <input type="text" name="entry.1810407768" placeholder="Contoh: SDN 20 Toboali" 
                        class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none border-gray-300 transition-all" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Alamat Email</label>
                    <input type="email" name="entry.1141583276" placeholder="alamat@email.com" 
                        class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none border-gray-300 transition-all" required>
                </div>

                <button type="submit" 
                    class="w-full bg-slate-900 hover:bg-blue-800 text-white font-bold py-3.5 rounded-md transition-all duration-300 shadow-lg mt-4 active:scale-95">
                    Kirim Pendaftaran
                </button>
            </div>
        </form>
    </div>

    <p class="text-center text-gray-400 text-[10px] mt-8 uppercase tracking-widest font-medium">
        © 2026 KKG GUGUS RADEN KELING • KAB. BANGKA SELATAN
    </p>

</body>
</html>
